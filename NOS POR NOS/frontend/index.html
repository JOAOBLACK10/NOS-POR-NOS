<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nós Por Nós Basketball</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {
            background: #000;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }


        /* ==========================================
           TELA INICIAL
           ========================================== */

        #telaLogin {

            width: 100vw;
            height: 100vh;

            background-image: url("./imagens/logo.png.jpeg");

            background-repeat: no-repeat;

            background-size: cover;

            /*
             * Move a imagem um pouco para cima,
             * deixando o logo do time mais alto.
             */
            background-position: center calc(50% - 70px);

            position: relative;

            overflow: hidden;
        }


        /* ==========================================
           ÁREA DA MENSAGEM E BOTÃO
           ========================================== */

        .conteudo-inicial {

            position: absolute;

            width: 100%;

            left: 0;

            /*
             * Coloca a mensagem abaixo do logo.
             */
            top: 76%;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;
        }


        /* ==========================================
           BEM-VINDO
           ========================================== */

        .mensagem {

            color: white;

            font-size: 20px;

            font-weight: 400;

            letter-spacing: 5px;

            text-align: center;

            margin-bottom: 42px;

            text-shadow: 0 2px 10px #000;

            white-space: nowrap;
        }


        /* ==========================================
           BOTÃO ENTRAR
           ========================================== */

        .btn-entrar {

            width: 430px;

            max-width: 90vw;

            height: 72px;

            background: #fff;

            color: #000;

            border: none;

            border-radius: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 35px;

            font-size: 16px;

            font-weight: bold;

            letter-spacing: 5px;

            cursor: pointer;

            transition: 0.2s;
        }


        .btn-entrar:hover {

            transform: translateY(-2px);

            box-shadow: 0 8px 25px rgba(255,255,255,0.15);
        }


        .seta {

            font-size: 30px;

            font-weight: normal;

            line-height: 1;
        }


        /* ==========================================
           SITE APÓS CLICAR EM ENTRAR
           ========================================== */

        #site {

            display: none;

            width: 100vw;

            min-height: 100vh;

            background: #000;

            color: white;

            text-align: center;

            padding: 60px 20px;
        }


        #site h1 {

            font-size: 42px;

            margin-bottom: 20px;
        }


        #site p {

            color: #aaa;

            font-size: 18px;
        }


        .btn-voltar {

            margin-top: 30px;

            padding: 15px 40px;

            background: white;

            color: black;

            border: none;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;
        }


        /* ==========================================
           CELULAR
           ========================================== */

        @media (max-width: 600px) {

            #telaLogin {

                background-position: center calc(50% - 35px);

            }


            .conteudo-inicial {

                top: 75%;

            }


            .mensagem {

                font-size: 14px;

                letter-spacing: 3px;

                margin-bottom: 30px;

            }


            .btn-entrar {

                width: 90%;

                height: 65px;

            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     TELA INICIAL
     ========================================== -->

<section id="telaLogin">


    <div class="conteudo-inicial">


        <p class="mensagem">
            BEM VINDO AO NOSSO TIME
        </p>


        <button
                type="button"
                class="btn-entrar"
                onclick="entrar()"
        >

                <span>
                    ENTRAR
                </span>

            <span class="seta">
                    →
                </span>

        </button>


    </div>


</section>



<!-- ==========================================
     SITE
     ========================================== -->

<section id="site">


    <h1>
        NÓS POR NÓS 🏀
    </h1>


    <p>
        Bem-vindo ao nosso time!
    </p>


    <button
            type="button"
            class="btn-voltar"
            onclick="voltar()"
    >
        VOLTAR
    </button>


</section>



<!-- ==========================================
     JAVASCRIPT
     ========================================== -->

<script>

    function entrar() {

        document.getElementById("telaLogin").style.display = "none";

        document.getElementById("site").style.display = "block";

    }


    function voltar() {

        document.getElementById("site").style.display = "none";

        document.getElementById("telaLogin").style.display = "block";

    }

</script>


</body>

</html>
